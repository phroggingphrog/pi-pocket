name: Manual fork release

on:
    workflow_dispatch:
        inputs:
            tag:
                description: "New release tag, for example v0.28.0"
                required: true
                type: string
            revision:
                description: "Exact 40-character owner-fork commit revision"
                required: true
                type: string
            confirm:
                description: "Type publish to create a release"
                required: true
                type: string

permissions:
    contents: write

concurrency:
    group: manual-fork-release
    cancel-in-progress: false

jobs:
    release:
        if: github.repository == 'phroggingphrog/pi-pocket' && inputs.confirm == 'publish'
        runs-on: ubuntu-latest
        steps:
            - name: Validate request
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
                  RELEASE_REVISION: ${{ inputs.revision }}
              run: |
                  [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]
                  [[ "$RELEASE_REVISION" =~ ^[0-9a-f]{40}$ ]]

            - uses: actions/checkout@v4
              with:
                  ref: ${{ inputs.revision }}
                  fetch-depth: 0

            - name: Verify fork source, main ancestry, version, and tag availability
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
                  RELEASE_REVISION: ${{ inputs.revision }}
              run: |
                  test "$GITHUB_REPOSITORY" = "phroggingphrog/pi-pocket"
                  test "$(git rev-parse HEAD)" = "$RELEASE_REVISION"
                  git fetch origin --prune --quiet
                  git cat-file -e "$RELEASE_REVISION^{commit}"
                  if ! git branch -r --contains "$RELEASE_REVISION" | grep -q 'origin/'; then
                    echo "Revision is not available in a branch on the owner fork."
                    exit 1
                  fi
                  test "v$(node -p 'require("./package.json").version')" = "$RELEASE_TAG"
                  test -z "$(git status --porcelain)"
                  ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"
                  if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
                  if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi

            - uses: actions/setup-node@v4
              with:
                  node-version: 24

            - name: Install locked dependencies and run tests
              run: |
                  npm ci
                  npm run check
                  npm run lint
                  npm test

            - name: Build and verify deterministic release artifacts
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
                  RELEASE_REVISION: ${{ inputs.revision }}
                  RELEASE_OUTPUT: release-artifacts
              run: node scripts/build-fork-release.mjs

            - name: Create owner-fork release and upload artifacts
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ inputs.tag }}
                  RELEASE_REVISION: ${{ inputs.revision }}
              run: |
                  gh release create "$RELEASE_TAG" release-artifacts/* \
                    --repo phroggingphrog/pi-pocket \
                    --target "$RELEASE_REVISION" \
                    --title "Pi Pocket ${RELEASE_TAG#v}" \
                    --generate-notes
